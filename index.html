<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cruscotto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --ink: #2d2a24; --ink-soft: #6c655a; --paper: #faf8f4; --card: #ffffff;
    --line: #e8e3da; --ambra: #b8860b; --ambra-bg: #fdf3dd;
    --rosso-vivo: #c0392b; --rosso-vivo-bg: #fbe9e7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.45;
    padding: 16px; padding-bottom: 60px; max-width: 760px; margin: 0 auto;
  }
  h1 { font-size: 1.35rem; margin-bottom: 2px; }
  .sub { color: var(--ink-soft); font-size: .85rem; margin-bottom: 16px; }

  /* ---- login ---- */
  #login { display: none; margin-top: 12vh; text-align: center; }
  #login .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 20px; }
  #login input {
    width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--line);
    border-radius: 10px; margin: 14px 0 10px;
  }
  #login button {
    width: 100%; padding: 12px; font-size: 1rem; border: 0; border-radius: 10px;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  #login .msg { margin-top: 12px; font-size: .9rem; color: var(--ink-soft); }

  /* ---- app ---- */
  #app { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; }
  .topbar a { color: var(--ink-soft); font-size: .8rem; text-decoration: none; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 999px; font-size: .82rem; font-weight: 600; color: #fff;
    border: 0; font-family: inherit; cursor: pointer;
  }
  .pill .n { background: rgba(255,255,255,.28); border-radius: 999px; padding: 0 7px; font-size: .8rem; }

  .card {
    scroll-margin-top: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    margin-bottom: 16px; overflow: hidden; border-left-width: 5px;
  }
  .card-head {
    padding: 10px 14px; color: #fff; font-weight: 700; font-size: .95rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card-head .add-btn {
    background: rgba(255,255,255,.25); border: 0; color: inherit; border-radius: 8px;
    padding: 4px 10px; font-size: .85rem; cursor: pointer; font-weight: 600;
  }
  .card-head .titolo { display: flex; flex-direction: column; min-width: 0; }
  .card-head .conta { font-weight: 500; font-size: .74rem; opacity: .85; }
  .card-head .add-btn { flex-shrink: 0; white-space: nowrap; }
  .riga {
    display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px;
    border-top: 1px solid var(--line); cursor: pointer;
  }
  .riga:first-of-type { border-top: 0; }
  .riga.chiusa { opacity: .5; }
  .riga.chiusa .testo { text-decoration: line-through; }
  .riga.in-corso { background: #fffdf6; }
  .tag-lav {
    font-size: .7rem; font-weight: 600; white-space: nowrap;
    color: var(--ambra); background: var(--ambra-bg); border-radius: 6px; padding: 0 5px; margin-left: 6px;
  }
  .stato-btn { line-height: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .riga .corpo { flex: 1; min-width: 0; }
  .riga .cliente { font-weight: 700; }
  .riga .gruppo-tag { font-size: .72rem; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 6px; }
  .riga .prio { color: var(--rosso-vivo); font-weight: 700; margin-right: 3px; }
  .riga .testo { font-size: .92rem; color: var(--ink); }
  .riga .note { font-size: .8rem; color: var(--ink-soft); }
  .chip {
    flex-shrink: 0; font-size: .74rem; font-weight: 700; border-radius: 7px;
    padding: 3px 8px; margin-top: 2px; white-space: nowrap;
  }
  .chip.neutro { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); }
  .chip.ambra  { background: var(--ambra-bg); color: var(--ambra); }
  .chip.rosso  { background: var(--rosso-vivo-bg); color: var(--rosso-vivo); }
  .stato-btn {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line);
    background: #fff; cursor: pointer; font-size: 13px; line-height: 22px; text-align: center;
    padding: 0; color: transparent; font-weight: 700;
  }
  .riga.in-corso .stato-btn { background: var(--ambra-bg); border-color: var(--ambra); color: var(--ambra); }
  .riga.chiusa .stato-btn { background: var(--ink-soft); border-color: var(--ink-soft); color: #fff; }
  .legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-soft); font-size: .78rem; font-weight: 400; padding-left: 27px; }
  .legenda b { font-weight: 700; color: var(--ink); }
  /* ---- Sine Limes 2: schede e card ---- */
  .schede { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .scheda-tab {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
    border: 1px solid var(--line); border-top: 3px solid var(--tc); background: var(--paper);
    color: var(--ink-soft); font-size: .82rem; font-weight: 600; cursor: pointer;
  }
  .scheda-tab .n { background: var(--line); border-radius: 999px; padding: 0 7px; font-size: .78rem; }
  .scheda-tab.attiva { background: var(--tc); border-color: var(--tc); color: #fff; }
  .scheda-tab.attiva .n { background: rgba(255,255,255,.28); }
  .griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; padding: 12px; }
  .voce-card {
    background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--tc);
    border-radius: 10px; padding: 10px 11px; cursor: pointer; min-width: 0;
  }
  .voce-card.chiusa { opacity: .5; }
  .voce-card .cliente { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .voce-card .prio { color: var(--rosso-vivo); font-weight: 700; margin-right: 3px; }
  .voce-card .testo { font-size: .88rem; margin-top: 3px; overflow-wrap: anywhere; }
  .voce-card .note { font-size: .8rem; color: var(--ink-soft); margin-top: 4px; overflow-wrap: anywhere; }
  .voce-card .chip { display: inline-block; margin-top: 6px; }
  .vc-spunte { display: flex; flex-direction: column; gap: 1px; margin-top: 7px; }
  .vc-riga {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 0; border: 0; background: none;
    cursor: pointer; font: inherit; font-size: .82rem; color: var(--ink-soft); text-align: left;
  }
  .vc-riga.si { color: var(--ink); font-weight: 600; }
  .vc-spunta {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line);
    background: #fff; font-size: 13px; line-height: 18px; text-align: center;
    font-weight: 700; color: transparent;
  }
  .vc-riga.si .vc-spunta { background: var(--tc); border-color: var(--tc); color: #fff; }
  .vuota { padding: 14px; font-size: .85rem; color: var(--ink-soft); font-style: italic; }

  .quick { padding: 12px 14px; border-top: 1px solid var(--line); display: none; background: var(--paper); }
  .quick input, .quick select {
    width: 100%; padding: 10px; font-size: .95rem; border: 1px solid var(--line);
    border-radius: 9px; margin-bottom: 8px; background: #fff;
  }
  .quick .row2 { display: flex; gap: 8px; }
  .quick button { padding: 10px 16px; border: 0; border-radius: 9px; background: var(--ink); color: #fff; font-size: .95rem; cursor: pointer; }

  /* ---- barra vista ---- */
  .viewbar {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 16px; font-size: .85rem;
  }
  .viewbar label { display: flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 600; }
  .viewbar input { width: 18px; height: 18px; accent-color: var(--ink); flex-shrink: 0; }
  .viewbar .hint { color: var(--ink-soft); font-size: .78rem; font-weight: 400; padding-left: 27px; }

  /* ---- toast annulla ---- */
  #toast {
    display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 14px; z-index: 20;
    width: calc(100% - 32px); max-width: 520px; box-shadow: 0 6px 20px rgba(45,42,36,.28);
    align-items: center; justify-content: space-between; gap: 12px; font-size: .88rem;
  }
  #toast .t-testo { flex: 1; min-width: 0; }
  #toast button {
    background: #fff; color: var(--ink); border: 0; border-radius: 8px;
    padding: 7px 14px; font-size: .85rem; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }

  /* ---- modal modifica ---- */
  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(45,42,36,.45); z-index: 10;
    align-items: flex-end; justify-content: center;
  }
  #modal {
    background: #fff; border-radius: 16px 16px 0 0; padding: 18px 16px 26px;
    width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto;
  }
  #modal h3 { font-size: 1rem; margin-bottom: 12px; }
  #modal label { font-size: .78rem; color: var(--ink-soft); display: block; margin: 8px 0 3px; }
  #modal input, #modal select, #modal textarea {
    width: 100%; padding: 10px; font-size: .95rem; border: 1px solid var(--line); border-radius: 9px; background: #fff;
  }
  #modal .azioni { display: flex; gap: 8px; margin-top: 16px; }
  #modal .azioni button { flex: 1; padding: 12px; border: 0; border-radius: 10px; font-size: .95rem; cursor: pointer; }
  #m-salva { background: var(--ink); color: #fff; }
  #m-elimina { background: var(--rosso-vivo-bg); color: var(--rosso-vivo); }
  #m-chiudi { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line) !important; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Cruscotto</h1>
    <p class="sub">Accesso riservato</p>
    <input type="email" id="email" placeholder="La tua email" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button id="btn-login">Accedi</button>
    <div class="msg" id="login-msg"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div><h1>Cruscotto</h1><div class="sub" id="oggi"></div></div>
    <a href="#" id="logout">esci</a>
  </div>
  <div class="pills" id="pills"></div>
  <div class="viewbar">
    <label><input type="checkbox" id="mostra-fatti"> Mostra anche le chiuse <span id="conta-fatti"></span></label>
    <div class="legenda">
      <span>Tocca una spunta per metterla o toglierla. Tocca la card per modificarla o chiuderla</span>
      <span>Solo le chiuse escono dalla lista, e restano in archivio: niente viene mai cancellato.</span>
    </div>
  </div>
  <div id="aree"></div>
</div>

<div id="toast">
  <span class="t-testo" id="toast-testo"></span>
  <button id="toast-undo">Annulla</button>
</div>

<div id="overlay">
  <div id="modal">
    <h3>Modifica voce</h3>
    <label>Cliente (iniziali o codice)</label><input id="m-cliente">
    <label>Cosa fare</label><input id="m-cosa">
    <label>Scadenza</label><input type="date" id="m-scadenza">
    <label>Gruppo</label><input id="m-gruppo" placeholder="es. beneficiari 2026">
    <label>Stato</label>
    <select id="m-stato">
      <option value="da_fare">Da fare</option>
      <option value="in_corso">In lavorazione</option>
      <option value="chiusa">Chiusa (in archivio)</option>
    </select>
    <label>Priorità</label>
    <select id="m-prio"><option value="0">Normale</option><option value="1">Alta</option></select>
    <label>Note</label><textarea id="m-note" rows="2"></textarea>
    <div class="azioni">
      <button id="m-elimina">Elimina</button>
      <button id="m-chiudi">Annulla</button>
      <button id="m-salva">Salva</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://rlzktnsyujfzocfmyhju.supabase.co';
const SB_KEY = 'sb_publishable_1PwU8NRDivpIXWglubDIUw_OAgMUsqz';
const sb = supabase.createClient(SB_URL, SB_KEY);

const COLORI = {
  rosso:   { pieno: '#b23b3b' }, azzurro: { pieno: '#2f7ab0' },
  giallo:  { pieno: '#b8901a' }, verde:   { pieno: '#3f8f6b' },
  prugna:  { pieno: '#7d5a9e' }, grigio:  { pieno: '#6c655a' },
  arancione: { pieno: '#c2703d' },
};
const colore = (nome) => COLORI[nome] || COLORI.grigio;

let AREE = [], VOCI = [], vociAperte = new Set();

// ---------- stati: da fare -> in lavorazione -> chiusa ----------
const STATI = ['da_fare', 'in_corso', 'chiusa'];
const NOME_STATO = { da_fare: 'Da fare', in_corso: 'In lavorazione', chiusa: 'Chiusa' };
const SIMBOLO_STATO = { da_fare: '', in_corso: '\u2026', chiusa: '\u2713' };
// 'fatto' e' il vecchio valore: lo leggiamo come 'chiusa' senza toccare i dati
const statoDi = (v) => (v.stato === 'fatto' ? 'chiusa' : (STATI.includes(v.stato) ? v.stato : 'da_fare'));
const eChiusa = (v) => statoDi(v) === 'chiusa';

// ---------- ordine alfabetico fisso ----------
// Unico criterio di ordinamento, per tutte le aree: il cliente. Lo stato, la scadenza e la data
// di modifica non spostano mai una voce.
const perCliente = (a, b) => (a.cliente || '').localeCompare(b.cliente || '', 'it') || String(a.id).localeCompare(String(b.id));

// ---------- Sine Limes 2: schede per gruppo ----------
const AREA_SL2 = 'Sine Limes 2';
const SCHEDE_SL2 = [
  { id: 'pagati',     etichetta: 'Pagati',                gruppo: 'SL2 \u00b7 1 Pagato \u2013 pronta',                       colore: COLORI.verde.pieno },
  { id: 'inviato',    etichetta: 'Preventivo inviato',    gruppo: 'SL2 \u00b7 2 Preventivo inviato \u2013 attesa pagamento', colore: COLORI.azzurro.pieno },
  { id: 'da-inviare', etichetta: 'Preventivo da inviare', gruppo: 'SL2 \u00b7 3 Preventivo da inviare',                      colore: COLORI.giallo.pieno },
  { id: 'ricordare',  etichetta: 'Da ricordare',          gruppo: 'SL2 \u00b7 4 In sospeso \u2013 verificare',               colore: COLORI.grigio.pieno },
  // Non e' un gruppo: raccoglie le pratiche con la spunta "Pratica inviata", da qualunque gruppo vengano
  { id: 'inviate',    etichetta: 'Inviate',               gruppo: null,                                                     colore: COLORI.prugna.pieno },
];
const GRUPPO_SL2_ESCLUSO = 'SL2 \u00b7 5 Non fa domanda';
const eSL2 = (a) => (a.nome || '').trim() === AREA_SL2;
// Scheda di partenza, decisa dal gruppo. Una voce senza gruppo riconosciuto finisce in
// "Da ricordare", cosi' non sparisce dalla vista
function schedaOrigine(v) {
  const s = SCHEDE_SL2.find((x) => x.gruppo && x.gruppo === v.gruppo);
  return s ? s.id : 'ricordare';
}
function schedaDi(v) {
  if (v.gruppo === GRUPPO_SL2_ESCLUSO) return null;
  return v.pratica_inviata === true ? 'inviate' : schedaOrigine(v);
}
// La spunta e' gia' disegnata sulla card: il prefisso della nota sarebbe un doppione
const notaPulita = (t) => (t || '').replace(/^\s*(?:\u2714\ufe0f?\s*Pagato\.|\u2610\s*Preventivo da inviare\.)\s*/, '');

// ---------- altre aree: una scheda per ogni stato della pratica ----------
const SCHEDE_STATO = [
  { id: 'da-inviare',  etichetta: 'Preventivo da inviare', colore: COLORI.giallo.pieno },
  { id: 'inviato',     etichetta: 'Preventivo inviato',    colore: COLORI.azzurro.pieno },
  { id: 'pagati',      etichetta: 'Pagati',                colore: COLORI.verde.pieno },
  { id: 'lavorazione', etichetta: 'In lavorazione',        colore: COLORI.arancione.pieno },
  { id: 'inviate',     etichetta: 'Inviate',               colore: COLORI.prugna.pieno },
];
// La card sta nella scheda dello stato piu' avanzato tra quelli spuntati
function schedaStato(v) {
  if (v.pratica_inviata === true) return 'inviate';
  if (statoDi(v) === 'in_corso') return 'lavorazione';
  if (v.pagato === true) return 'pagati';
  if (v.preventivo_inviato === true) return 'inviato';
  return 'da-inviare';
}

const areaDi = (v) => AREE.find((a) => a.id === v.area_id);
const schedeDi = (a) => (a && eSL2(a) ? SCHEDE_SL2 : SCHEDE_STATO);
const schedaVoce = (v, a) => (a && eSL2(a) ? schedaDi(v) : schedaStato(v));
// Scheda aperta in ogni area: se non e' stata scelta, la prima
const schedaAperta = {};
const schedaAttiva = (a) => schedeDi(a).find((s) => s.id === schedaAperta[a.id]) || schedeDi(a)[0];

// Le quattro spunte di ogni pratica. "In lavorazione" non ha un campo suo: e' lo stato in_corso
const SPUNTE = [
  { campo: 'pagato',             etichetta: 'Pagato',             attiva: (v) => v.pagato === true },
  { campo: 'preventivo_inviato', etichetta: 'Preventivo inviato', attiva: (v) => v.preventivo_inviato === true },
  { campo: 'lavorazione',        etichetta: 'In lavorazione',     attiva: (v) => statoDi(v) === 'in_corso' },
  { campo: 'pratica_inviata',    etichetta: 'Pratica inviata',    attiva: (v) => v.pratica_inviata === true },
];

function cardVoce(v, s, a) {
  const sl2 = eSL2(a);
  const nota = sl2 ? notaPulita(v.note) : (v.note || '');
  const spunte = SPUNTE.map((x) => `<button class="vc-riga ${x.attiva(v) ? 'si' : ''}" data-spunta="${v.id}" data-campo="${x.campo}"><span class="vc-spunta">\u2714\ufe0e</span>${x.etichetta}</button>`).join('');
  return `
    <div class="voce-card ${eChiusa(v) ? 'chiusa' : ''}" data-id="${v.id}" style="--tc:${s.colore}">
      ${!sl2 && v.priorita > 0 ? '<span class="prio">\u2691</span>' : ''}<span class="cliente">${esc(v.cliente)}</span>
      ${!sl2 && v.cosa_fare ? `<div class="testo">${esc(v.cosa_fare)}</div>` : ''}
      ${nota ? `<div class="note">${esc(nota)}</div>` : ''}
      ${chip(v)}
      <div class="vc-spunte">${spunte}</div>
    </div>`;
}

function corpoSchede(a, voci) {
  const perScheda = (id) => voci.filter((v) => schedaVoce(v, a) === id);
  const attiva = schedaAttiva(a);
  const tabs = schedeDi(a).map((s) => `<button class="scheda-tab ${s.id === attiva.id ? 'attiva' : ''}" data-scheda="${s.id}" data-area="${a.id}" style="--tc:${s.colore}">${s.etichetta} <span class="n">${perScheda(s.id).length}</span></button>`).join('');
  const mie = perScheda(attiva.id);
  return `<div class="schede">${tabs}</div>` + (mie.length
    ? `<div class="griglia">${mie.map((v) => cardVoce(v, attiva, a)).join('')}</div>`
    : '<div class="vuota">Nessuna voce in questa scheda</div>');
}

// ---------- auth ----------
const $ = (id) => document.getElementById(id);

sb.auth.onAuthStateChange((_ev, session) => {
  if (session) { $('login').style.display = 'none'; $('app').style.display = 'block'; carica(); }
  else { $('app').style.display = 'none'; $('login').style.display = 'block'; }
});

$('btn-login').onclick = async () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) return;
  $('login-msg').textContent = 'Accesso in corso…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) $('login-msg').textContent = 'Errore: ' + error.message;
};

$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btn-login').click(); });

$('logout').onclick = (e) => { e.preventDefault(); sb.auth.signOut(); };

// ---------- dati ----------
async function carica() {
  const [ra, rv] = await Promise.all([
    sb.from('aree').select('*').order('ordine'),
    sb.from('voci').select('*').order('cliente', { ascending: true }),
  ]);
  if (ra.error || rv.error) { alert('Errore di caricamento: ' + (ra.error || rv.error).message); return; }
  AREE = ra.data; VOCI = rv.data.sort(perCliente);
  render();
}

// ---------- chip scadenza ----------
function chip(v) {
  if (!v.scadenza) return '';
  if (eChiusa(v)) return '';                    // voce chiusa: chip spento
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const s = new Date(v.scadenza + 'T00:00:00');
  const gg = Math.round((s - oggi) / 86400000);
  const data = s.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
  if (gg < 0)  return `<span class="chip rosso">Scaduto ${data}</span>`;
  if (gg === 0) return `<span class="chip rosso">Oggi</span>`;
  if (gg === 1) return `<span class="chip ambra">Domani</span>`;
  if (gg <= 7)  return `<span class="chip ambra">Fra ${gg} gg · ${data}</span>`;
  return `<span class="chip neutro">${data}</span>`;
}

// ---------- render ----------
const esc = (t) => (t || '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  $('oggi').textContent = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  const mostraChiuse = $('mostra-fatti').checked;

  const nChiuseTot = VOCI.filter(eChiusa).length;
  $('conta-fatti').textContent = nChiuseTot ? `(${nChiuseTot})` : '';

  $('pills').innerHTML = AREE.map((a) => {
    const n = VOCI.filter((v) => v.area_id === a.id && !eChiusa(v)).length;
    return `<button class="pill" data-vai="${a.id}" style="background:${colore(a.colore).pieno}">${esc(a.nome)} <span class="n">${n}</span></button>`;
  }).join('');

  $('aree').innerHTML = AREE.map((a) => {
    const c = colore(a.colore).pieno;
    let voci = VOCI.filter((v) => v.area_id === a.id);
    const nDaFare = voci.filter((v) => statoDi(v) === 'da_fare').length;
    const nInCorso = voci.filter((v) => statoDi(v) === 'in_corso').length;
    const nChiuse = voci.filter(eChiusa).length;
    if (!mostraChiuse) voci = voci.filter((v) => !eChiusa(v));

    const conta = [
      `${nDaFare} da fare`,
      nInCorso ? `${nInCorso} in lavorazione` : '',
      nChiuse ? `${nChiuse} ${nChiuse === 1 ? 'chiusa' : 'chiuse'}` : '',
    ].filter(Boolean).join(' \u00b7 ');

    const righe = corpoSchede(a, voci);

    const aperto = vociAperte.has(a.id);
    return `
      <div class="card" id="area-${a.id}" style="border-left-color:${c}">
        <div class="card-head" style="background:${c}">
          <span class="titolo">${esc(a.nome)}<span class="conta">${conta}</span></span>
          <button class="add-btn" data-add="${a.id}">${aperto ? 'chiudi' : '+ aggiungi'}</button>
        </div>
        ${righe}
        <div class="quick" id="quick-${a.id}" style="${aperto ? 'display:block' : ''}">
          <input id="q-cliente-${a.id}" placeholder="Cliente">
          <input id="q-cosa-${a.id}" placeholder="Cosa fare">
          <input id="q-nota-${a.id}" placeholder="Nota (facoltativa)">
          <div class="row2">
            <input type="date" id="q-data-${a.id}">
            <button data-save="${a.id}">Aggiungi</button>
          </div>
        </div>
      </div>`;
  }).join('');

  // eventi
  document.querySelectorAll('[data-vai]').forEach((b) => b.onclick = () => {
    const el = $('area-' + b.dataset.vai);
    if (el) el.scrollIntoView({ block: 'start' });
  });
  document.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => {
    const id = b.dataset.add;
    vociAperte.has(id) ? vociAperte.delete(id) : vociAperte.add(id);
    render();
  });
  document.querySelectorAll('[data-save]').forEach((b) => b.onclick = () => aggiungi(b.dataset.save));
  document.querySelectorAll('[data-scheda]').forEach((b) => b.onclick = () => { schedaAperta[b.dataset.area] = b.dataset.scheda; render(); });
  document.querySelectorAll('[data-spunta]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); commutaSpunta(b.dataset.spunta, b.dataset.campo); });
  document.querySelectorAll('.voce-card').forEach((r) => r.onclick = () => apriModal(r.dataset.id));
}

try { $('mostra-fatti').checked = localStorage.getItem('mostra-fatti') === '1'; } catch (e) {}
$('mostra-fatti').onchange = () => {
  try { localStorage.setItem('mostra-fatti', $('mostra-fatti').checked ? '1' : '0'); } catch (e) {}
  render();
};

// ---------- toast con annulla ----------
let toastTimer = null, toastUndo = null;
function mostraToast(testo, onUndo) {
  clearTimeout(toastTimer);
  toastUndo = onUndo;
  $('toast-testo').textContent = testo;
  $('toast').style.display = 'flex';
  toastTimer = setTimeout(nascondiToast, 9000);
}
function nascondiToast() {
  clearTimeout(toastTimer);
  toastUndo = null;
  $('toast').style.display = 'none';
}
$('toast-undo').onclick = () => {
  const undo = toastUndo;
  nascondiToast();
  if (undo) undo();
};

// ---------- azioni ----------
async function aggiungi(areaId) {
  const cliente = $(`q-cliente-${areaId}`).value.trim();
  const cosa = $(`q-cosa-${areaId}`).value.trim();
  const nota = $(`q-nota-${areaId}`).value.trim() || null;
  const data = $(`q-data-${areaId}`).value || null;
  if (!cliente && !cosa) return;
  const nuova = { area_id: areaId, cliente, cosa_fare: cosa, scadenza: data, note: nota };
  // La voce nasce nella scheda aperta, cosi' resta sotto gli occhi dopo l'aggiunta
  const area = AREE.find((a) => a.id === areaId);
  const s = area ? schedaAttiva(area) : null;
  if (area && !eSL2(area)) {
    if (s.id === 'inviato') nuova.preventivo_inviato = true;
    if (s.id === 'pagati') nuova.pagato = true;
    if (s.id === 'lavorazione') nuova.stato = 'in_corso';
    if (s.id === 'inviate') nuova.pratica_inviata = true;
  }
  if (area && eSL2(area)) {
    nuova.gruppo = s.gruppo || SCHEDE_SL2.find((x) => x.id === 'ricordare').gruppo;
    if (s.id === 'pagati') nuova.pagato = true;
    if (s.id === 'inviato') nuova.preventivo_inviato = true;
    if (s.id === 'inviate') nuova.pratica_inviata = true;
  }
  const { data: riga, error } = await sb.from('voci').insert(nuova).select().single();
  if (error) { alert('Errore: ' + error.message); return; }
  vociAperte.delete(areaId);
  VOCI.push(riga);
  VOCI.sort(perCliente);
  render();
}

// Aggiorna la voce su Supabase e poi sul posto nella lista: la posizione non cambia
async function aggiornaVoce(id, campi) {
  const { error } = await sb.from('voci').update(campi).eq('id', id);
  if (error) { alert('Errore: ' + error.message); return false; }
  const v = VOCI.find((x) => x.id === id);
  if (v) Object.assign(v, campi);
  render();
  return true;
}

async function commutaSpunta(id, campo) {
  const v = VOCI.find((x) => x.id === id);
  const spunta = SPUNTE.find((x) => x.campo === campo);
  if (!v || !spunta) return;
  const a = areaDi(v);
  const era = spunta.attiva(v);
  const [prima, dopo] = campo === 'lavorazione'
    ? [{ stato: v.stato }, { stato: era ? 'da_fare' : 'in_corso' }]
    : [{ [campo]: v[campo] }, { [campo]: !era }];
  const schedaPrima = schedaVoce(v, a);
  if (!(await aggiornaVoce(id, dopo))) return;
  // Se la spunta ha spostato la card in un'altra scheda lo si dice, e si puo' tornare indietro
  const schedaDopo = schedaVoce(v, a);
  if (schedaDopo !== schedaPrima) {
    const dove = schedeDi(a).find((x) => x.id === schedaDopo).etichetta;
    mostraToast(`${v.cliente || 'Voce'} \u2014 spostata in \u201c${dove}\u201d.`, () => aggiornaVoce(id, prima));
  }
}

// ---------- modal ----------
let modalId = null;
function apriModal(id) {
  const v = VOCI.find((x) => x.id === id);
  if (!v) return;
  modalId = id;
  $('m-cliente').value = v.cliente || '';
  $('m-cosa').value = v.cosa_fare || '';
  $('m-scadenza').value = v.scadenza || '';
  $('m-gruppo').value = v.gruppo || '';
  $('m-stato').value = statoDi(v);
  $('m-prio').value = String(v.priorita || 0);
  $('m-note').value = v.note || '';
  $('overlay').style.display = 'flex';
}
$('m-chiudi').onclick = () => { $('overlay').style.display = 'none'; };
$('overlay').onclick = (e) => { if (e.target.id === 'overlay') $('overlay').style.display = 'none'; };
$('m-salva').onclick = async () => {
  $('overlay').style.display = 'none';
  await aggiornaVoce(modalId, {
    cliente: $('m-cliente').value.trim(),
    cosa_fare: $('m-cosa').value.trim(),
    scadenza: $('m-scadenza').value || null,
    gruppo: $('m-gruppo').value.trim() || null,
    stato: $('m-stato').value,
    priorita: Number($('m-prio').value),
    note: $('m-note').value.trim() || null,
  });
};
$('m-elimina').onclick = async () => {
  const v = VOCI.find((x) => x.id === modalId);
  if (!confirm(`Eliminare DEFINITIVAMENTE la voce${v && v.cliente ? ' di ' + v.cliente : ''}?\n\nQuesta azione non si puo\u0300 annullare. Per archiviarla senza perderla mettila su \u201cChiusa\u201d con il quadratino \u2713.`)) return;
  const { error } = await sb.from('voci').delete().eq('id', modalId);
  $('overlay').style.display = 'none';
  if (error) { alert('Errore: ' + error.message); return; }
  VOCI = VOCI.filter((x) => x.id !== modalId);
  render();
};
</script>
